<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="${c.title} + ' — FundHope'">Campaign — FundHope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .page-wrap{padding:120px 4vw 80px;background:linear-gradient(to bottom,#f7f9f3,#fff)}
    .grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr;gap:28px;align-items:start}
    .card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:0 30px 60px rgba(60,80,10,.06);overflow:hidden}
    .card-body{padding:32px}
    .card-body h1{font-size:clamp(28px,4vw,44px);font-weight:400;letter-spacing:-.03em;margin-bottom:12px}
    .meta{display:flex;gap:12px;flex-wrap:wrap;color:#4a4f3a;margin-bottom:18px}
    .pill-soft{display:inline-flex;padding:4px 10px;border-radius:999px;background:var(--pill);color:#2c3a10;font-size:12px}
    .desc{white-space:pre-wrap;line-height:1.7}
    .donate-card{position:sticky;top:110px;padding:28px}
    .amt-row{display:flex;justify-content:space-between;margin:16px 0}
    .bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--lime))}
    .donate-card .btn{width:100%;height:44px}
    .form-group{margin-bottom:14px}
    label{display:block;font-size:13px;margin-bottom:8px}
    input{width:100%;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font:inherit}
    .list{margin-top:24px}
    .donation{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
    @media(max-width:920px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav th:replace="~{fragments :: nav}"></nav>
  <p th:if="${thanks}" th:text="${thanks}" style="max-width:1080px;margin:110px auto -70px;padding:12px 18px;background:#e7efcf;border-radius:999px;color:#2c3a10"></p>
  <main class="page-wrap">
    <div class="grid">
      <article class="card">
        <div class="card-body">
          <div class="meta">
            <span class="pill-soft" th:text="${c.category}">Category</span>
            <span>Deadline: <span th:text="${c.deadline}"></span></span>
            <span th:if="${demo}" class="pill-soft">Demo mode</span>
          </div>
          <h1 th:text="${c.title}">Title</h1>
          <div class="desc" th:text="${c.description}">Description</div>
          <section class="list">
            <h2 style="font-weight:400;letter-spacing:-.02em">Recent donations</h2>
            <div th:each="d : ${list}" class="donation">
              <div>
                <strong th:text="${d.donorName}">Donor</strong>
                <div style="color:#4a4f3a;font-size:14px" th:text="${d.paymentRef}">REF</div>
              </div>
              <div>₹ <span th:text="${#numbers.formatDecimal(d.amount,0,'COMMA',0,'POINT')}">0</span></div>
            </div>
            <p th:if="${#lists.isEmpty(list)}" style="color:#4a4f3a">Be the first to donate.</p>
          </section>
        </div>
      </article>
      <aside class="card donate-card">
        <div class="amt-row">
          <div>
            <div style="font-size:clamp(28px,4vw,38px);font-weight:600;letter-spacing:-.03em">₹ <span th:text="${#numbers.formatDecimal(c.raisedAmount,0,'COMMA',0,'POINT')}">0</span></div>
            <div style="color:#4a4f3a">raised of ₹ <span th:text="${#numbers.formatDecimal(c.goalAmount,0,'COMMA',0,'POINT')}">0</span></div>
          </div>
        </div>
        <div class="bar"><i th:with="pct=${c.goalAmount > 0 ? T(java.lang.Math).floor(T(java.lang.Math).min(c.raisedAmount * 100.0 / c.goalAmount, 100.0)) : 0}" th:style="'width:' + ${pct} + '%'"></i></div>
        <form method="post" th:action="@{'/campaigns/' + ${c.id} + '/donate'}">
          <div class="form-group">
            <label>Your name (leave blank for anonymous)</label>
            <input name="donorName">
          </div>
          <div class="form-group">
            <label>Amount (₹)</label>
            <input name="amount" type="number" min="1" step="1" required>
          </div>
          <button class="btn">Donate now</button>
        </form>
      </aside>
    </div>
  </main>
</body>
</html>
