<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Start a campaign — FundHope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .page-wrap{padding:120px 4vw 80px;background:linear-gradient(to bottom,#f7f9f3,#fff)}
    .form-card{max-width:720px;margin:0 auto;background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:0 30px 60px rgba(60,80,10,.08);padding:40px 32px}
    .form-card h1{font-size:clamp(28px,4vw,42px);font-weight:400;letter-spacing:-.03em;margin-bottom:10px}
    .form-card p.sub{color:#4a4f3a;margin-bottom:28px}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .form-group{margin-bottom:18px}
    label{display:block;font-size:13px;color:#2c3a10;margin-bottom:8px}
    input,textarea,select{width:100%;padding:12px 16px;border-radius:16px;border:1px solid var(--line);font:inherit;background:#fff}
    textarea{min-height:140px;border-radius:18px}
    .btn{height:42px;padding:0 22px}
    @media(max-width:680px){.grid-2{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav th:replace="~{fragments :: nav}"></nav>
  <main class="page-wrap">
    <div class="form-card">
      <h1>Launch your campaign</h1>
      <p class="sub">Share your story and set a goal to rally support.</p>
      <form method="post" action="/campaigns">
        <div class="form-group">
          <label>Title</label>
          <input name="title" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select name="category">
            <option>Education</option>
            <option>Health</option>
            <option>Community</option>
            <option>Environment</option>
            <option>Other</option>
          </select>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Goal amount (₹)</label>
            <input name="goal" type="number" min="1" step="1" required>
          </div>
          <div class="form-group">
            <label>Deadline</label>
            <input name="deadline" type="date" required>
          </div>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" required></textarea>
        </div>
        <button class="btn">Create campaign</button>
      </form>
    </div>
  </main>
</body>
</html>
