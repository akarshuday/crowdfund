# Values come from environment variables when deployed; the part after ":" is the local default.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/crowdfund?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
# --- PAYMENTS: leave blank = safe DEMO mode (no real money) ---
payment.razorpay.key=${RAZORPAY_KEY:}
payment.razorpay.secret=${RAZORPAY_SECRET:}
